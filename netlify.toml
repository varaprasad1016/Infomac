# The 3D hero needs a bundler: three.js, postprocessing and n8ao ship as bare ES
# modules a browser cannot resolve. Vite builds to dist/ and fingerprints its
# own output; everything in public/ is copied through at the same path.
[build]
  publish = "dist"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "22"

# Everything Vite emits into /assets is content-addressed — the hashed JS and
# CSS, and the video and icon copied from public/assets, which change rarely.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The page itself must not be cached hard, or an edit takes a day to appear.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
