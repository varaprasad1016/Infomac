# The 3D hero needs a bundler: three.js, postprocessing and n8ao ship as bare ES
# modules a browser cannot resolve. Vite builds to dist/.
[build]
  publish = "dist"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "22"

# /assets holds *only* Vite's own output, and every file in it carries a content
# hash in its name — including the demo video, which is referenced from the
# markup and so gets fingerprinted. A changed file is therefore a changed URL,
# which is the only safe reason to say "immutable".
#
# Nothing with a stable filename may live here. Marking a fixed URL immutable
# pins it in every browser and in the CDN for a year, and no amount of reloading
# gets the new file.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Fixed URLs, copied through from public/ untouched. Cached, but revalidated.
[[headers]]
  for = "/brand/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"

# The page itself must not be cached hard, or an edit takes a day to appear.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
